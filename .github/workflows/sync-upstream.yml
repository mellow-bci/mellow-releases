name: Sync public Mellow releases

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-upstream-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'mellow-bci/mellow-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable mirror contracts
        run: node --test scripts/tests/*.test.mjs
      - name: Configure repository-scoped Git credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Mirror published upstream releases and signed feed
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_REPORT: ${{ runner.temp }}/mellow-public-mirror.json
        run: node scripts/sync-upstream.mjs --apply
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mirror-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mellow-public-mirror.json
          if-no-files-found: ignore
          retention-days: 30
